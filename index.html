<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkage</title>

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Linkage">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f7fc;
  color:#0f2d5c;
  text-align:center;
  padding-bottom:90px;
}

.header{
  padding:18px 20px 8px;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  object-fit:contain;
}

.title{
  font-size:30px;
  font-weight:700;
  color:#0b2d62;
  margin-top:5px;
  letter-spacing:.2px;
}

.sub{
  color:#71809a;
  font-size:16px;
  margin-top:2px;
  margin-bottom:16px;
}

.nameBox{
  width:calc(100% - 32px);
  max-width:620px;
  box-sizing:border-box;
  margin:0 auto 14px;
  padding:14px 16px;
  background:#fff;
  color:#0f2d5c;
  border:1px solid #edf1f6;
  border-radius:14px;
  box-shadow:0 5px 16px rgba(38,70,110,.08);
  font-size:15px;
}

.btn{
  position:relative;
  width:calc(100% - 32px);
  max-width:620px;
  min-height:72px;
  margin:9px auto;
  padding:10px 54px 10px 92px;
  box-sizing:border-box;

  border:1px solid #edf1f6;
  border-radius:16px;
  background:#fff;

  color:#0f2d5c;
  cursor:pointer;
  display:block;

  text-align:left;
  font-size:17px;
  font-weight:700;

  box-shadow:0 5px 16px rgba(38,70,110,.08);

  transition:
    transform .12s ease,
    box-shadow .12s ease,
    background .12s ease;
}

.btn:active{
  transform:scale(.985);
  background:#f8fbff;
  box-shadow:0 2px 8px rgba(38,70,110,.08);
}

/* 左側の丸いアイコン */
.btn::before{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);

  width:54px;
  height:54px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:normal;
}

/* 右側の矢印 */
.btn::after{
  content:"›";
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-52%);
  color:#17477e;
  font-size:32px;
  font-weight:400;
}

/* 各メニューのアイコン */
.alcohol::before{
  content:"🚗";
  background:#e7f2ff;
}

.form::before{
  content:"📄";
  background:#e7f9ed;
}

.copy::before{
  content:"🔗";
  background:#fff1e3;
}

.car::before{
  content:"🚘";
  background:#e7f2ff;
}

.use::before{
  content:"🚚";
  background:#e1faf8;
}

.schedule::before{
  content:"🗓️";
  background:#eeebff;
}

.job::before{
  content:"👥";
  background:#e4f8ee;
}

.blue::before{
  content:"📂";
  background:#fff4d9;
}

.property::before{
  content:"🏠";
  background:#efebff;
}

.advance::before{
  content:"💴";
  background:#fff2dc;
}

.chat::before{
  content:"💬";
  background:#ffe7f0;
}

.viewer::before{
  content:"🔍";
  background:#e1f8fc;
}

.admin::before{
  content:"⚙️";
  background:#e9eef5;
}

/* メニュー名 */
.menuTitle{
  display:block;
  font-size:17px;
  font-weight:700;
  line-height:1.3;
  color:#0f2d5c;
}

/* メニュー説明 */
.menuDesc{
  display:block;
  margin-top:3px;
  font-size:13px;
  line-height:1.3;
  font-weight:400;
  color:#7a899f;
}
  
.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:68px;

  background:rgba(255,255,255,.97);
  border-top:1px solid #e7edf5;

  display:flex;
  justify-content:space-around;
  align-items:center;

  box-shadow:0 -4px 18px rgba(38,70,110,.07);
  z-index:100;
}

.navBtn{
  flex:1;
  height:100%;
  border:none;
  background:transparent;

  color:#47617f;
  font-size:12px;
  font-weight:500;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;

  cursor:pointer;
}

.navBtn .navIcon{
  display:block;
  width:24px;
  height:24px;
  line-height:1;
}

.navBtn .navIcon svg{
  width:24px;
  height:24px;

  fill:none;
  stroke:#35577f;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.navBtn:active{
  background:#f4f8fc;
  color:#0f2d5c;
}

.updateOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
}

.updateCard{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:22px;
  padding:22px 18px;
  box-shadow:0 18px 40px rgba(0,0,0,0.25);
  text-align:left;
}

.updateTitle{
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

.updateVersion{
  font-size:14px;
  color:#666;
  margin-bottom:12px;
}

.updateMessage{
  font-size:16px;
  line-height:1.8;
  color:#333;
  white-space:pre-line;
  margin-bottom:18px;
}

.updateButtons{
  display:flex;
  gap:10px;
}

.updateBtn{
  flex:1;
  min-height:50px;
  border:none;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.updatePrimary{
  background:linear-gradient(180deg,#2f6df6,#2457c9);
  color:#fff;
}

.updateSecondary{
  background:#e5e7eb;
  color:#111;
}

@media (max-width:600px){
  .updateButtons{
    flex-direction:column;
  }
}

/* ログイン認証が終わるまで画面を非表示 */
body{
  visibility:hidden;
}
  
</style>
</head>

<body>

<div class="header">
  <img src="icon.png" class="logo" alt="Linkageロゴ">
  <div class="title">Linkage</div>
  <div class="sub">メニュー</div>
</div>

<div class="nameBox" id="userBox">ログイン中</div>

<button class="btn alcohol" onclick="goAlcohol()">
  <span class="menuTitle">アルコールチェック</span>
  <span class="menuDesc">アルコール検査の記録・確認</span>
</button>

<button class="btn form" onclick="goForm()">
  <span class="menuTitle">応募フォームを開く</span>
  <span class="menuDesc">応募フォームの確認・管理</span>
</button>

<button class="btn copy" onclick="copyForm()">
  <span class="menuTitle">URLコピー</span>
  <span class="menuDesc">各種URLのコピー</span>
</button>

<button class="btn car" onclick="goCar()">
  <span class="menuTitle">車両管理</span>
  <span class="menuDesc">車両情報の登録・管理</span>
</button>

<button class="btn use" onclick="goUse()">
  <span class="menuTitle">車両使用管理</span>
  <span class="menuDesc">車両の使用状況管理</span>
</button>

<button class="btn schedule" onclick="goSchedule()">
  <span class="menuTitle">スケジュール</span>
  <span class="menuDesc">スケジュールの確認・管理</span>
</button>

<button class="btn job" onclick="goJob()">
  <span class="menuTitle">求職者共有</span>
  <span class="menuDesc">求職者情報の共有・管理</span>
</button>

<button class="btn blue" onclick="goHaken()">
  <span class="menuTitle">派遣管理書類</span>
  <span class="menuDesc">派遣関連書類の管理</span>
</button>

<button class="btn property" onclick="goProperty()">
  <span class="menuTitle">社宅・物件管理</span>
  <span class="menuDesc">社宅・物件情報の管理</span>
</button>

<button class="btn property" onclick="goPropertyPhoto()">
  <span class="menuTitle">写真管理</span>
  <span class="menuDesc">写真データの管理</span>
</button>

<button class="btn advance" onclick="goAdvance()">
  <span class="menuTitle">前借管理</span>
  <span class="menuDesc">前借の申請・管理</span>
</button>

<button class="btn chat" onclick="goChat()">
  <span class="menuTitle">社内チャット</span>
  <span class="menuDesc">社内での連絡・共有</span>
</button>

<button class="btn viewer" onclick="goPropertyViewer()">
  <span class="menuTitle">検索</span>
  <span class="menuDesc">各種情報の検索</span>
</button>

<div id="adminArea" style="display:block;">
  <button class="btn admin" onclick="goAdmin()">
    <span class="menuTitle">管理画面</span>
    <span class="menuDesc">システムの設定・管理</span>
  </button>
</div>

<div class="bottomNav">

  <button class="navBtn navHome" onclick="goHome()">
    <span class="navIcon">
      <svg viewBox="0 0 24 24">
        <path d="M3 11L12 3L21 11"/>
        <path d="M5 10V21H19V10"/>
        <path d="M9 21V14H15V21"/>
      </svg>
    </span>
    ホーム
  </button>

  <button class="navBtn navCar" onclick="goCar()">
    <span class="navIcon">
      <svg viewBox="0 0 24 24">
        <path d="M5 17H19"/>
        <path d="M4 17V12L6 7H18L20 12V17"/>
        <path d="M6 12H18"/>
        <circle cx="7" cy="17" r="2"/>
        <circle cx="17" cy="17" r="2"/>
      </svg>
    </span>
    車両
  </button>

  <button class="navBtn navUse" onclick="goUse()">
    <span class="navIcon">
      <svg viewBox="0 0 24 24">
        <path d="M3 6H14V17H3Z"/>
        <path d="M14 10H18L21 13V17H14Z"/>
        <circle cx="7" cy="18" r="2"/>
        <circle cx="18" cy="18" r="2"/>
      </svg>
    </span>
    使用
  </button>

  <button class="navBtn navChat" onclick="goChat()">
    <span class="navIcon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5H20V16H9L4 20V5Z"/>
      </svg>
    </span>
    チャット
  </button>

</div>
<div class="updateOverlay" id="updateOverlay">
  <div class="updateCard">
    <div class="updateTitle" id="updateTitle">更新があります</div>
    <div class="updateVersion" id="updateVersion"></div>
    <div class="updateMessage" id="updateMessage"></div>
    <div class="updateButtons">
      <button class="updateBtn updatePrimary" id="updateGoBtn">更新する</button>
      <button class="updateBtn updateSecondary" id="updateLaterBtn">あとで</button>
    </div>
  </div>
</div>

<script>
/* ===== URL設定 ===== */
const ALCOHOL_URL = "https://script.google.com/macros/s/AKfycbzwZ9DT8cCl3wpMEZ6oMmnUC0Ofa_LumzACVCUtYz-dEjrsRN_yWl5wLsA-2Tj9YgvvwQ/exec";
const FORM_URL = "https://script.google.com/macros/s/AKfycbwIw3h--vBxXMP8AYzOyG51oITqv6WKYm2T41nxFY1qsbkZo8dOnwfgKrF-FPARfCI7/exec";
const PROPERTY_URL = "https://script.google.com/macros/s/AKfycbxvP86tyS2YsIwAO6YgZsUIXF9H7wx40q7D6BqNSf8R6UZYl6fkWTHa1WkFj-OskSUp5Q/exec";
const CHAT_URL = "https://script.google.com/macros/s/AKfycbzY--b0L9LzJ7PCjO1POgAh2coeUanrpzk_1WaHNzFQCr80S8BZU07Wu_Y2-VeV4Ee8RA/exec";
const CAR_URL = "https://script.google.com/macros/s/AKfycbxLzeCa7O5_Yg5ZaVQZF8K-2OlGXeT5gmGwEe4ZlTLrEGYOYJUWzYvylgJ1U0PHXikO-g/exec";
const VIEWER_URL = "https://script.google.com/macros/s/AKfycbxvP86tyS2YsIwAO6YgZsUIXF9H7wx40q7D6BqNSf8R6UZYl6fkWTHa1WkFj-OskSUp5Q/exec?mode=viewer";
const USE_URL = "https://script.google.com/macros/s/AKfycbxQev0GXTduIpwVv3fS4dIHnYBKtBZEdh0iRsq9lE2Li_AktExOdkGPuzQBKHR3M9AdOA/exec";
const SCHEDULE_URL = "https://script.google.com/macros/s/AKfycbxc3sXqt6yTM_OZugasDjbhDuv4qm_maJRJo7XkbM9uDFQf8YzVoUr2DhrbWxFJz-pg/exec";
const JOB_URL = "https://script.google.com/macros/s/AKfycbwu3me6U1IZ5JJkNHqf4V14Ecj4fQtfz6NDOe05p0XwqmDyNIKB-UKCPSi1tULrY3Dl/exec";
const RESUME_URL = "https://script.google.com/macros/s/AKfycbwDB-fz8gV5BvpLDZPms-Cus5X4dJ26clyLWkeHGRMA7KnMReTjNQOBBTROnSdtmYr5/exec";
const SHATAKU_URL =　"https://script.google.com/macros/s/AKfycbwDB-fz8gV5BvpLDZPms-Cus5X4dJ26clyLWkeHGRMA7KnMReTjNQOBBTROnSdtmYr5/exec?page=property";
const ADVANCE_URL = "https://script.google.com/macros/s/AKfycbzUwE6YWI9J7_kCGePkEn8VYLttgt0oGBVrjbBwImaTOLzk5g8XO7XFeZEi1nphJuqL/exec";
  
const ADMIN_URL = "https://script.google.com/macros/s/AKfycbwuFHe1cBIjUB_tgEQrV4ngESM0M9gp4mDwbRWM5tgfuXxh_mLuREFgWFFbezEPMBNg/exec";
const UPDATE_API_URL = "https://script.google.com/macros/s/AKfycby6ZroDYpfu5y52VrQ9nTNEEsrC6joYt49zdendeI2du1OtbwcUfz7nAlGMgQeFV5iX/exec";

const CURRENT_MENU_VERSION = "v2.0.4";

/* ===== ログイン情報取得 ===== */
const params = new URLSearchParams(window.location.search);

const empName =
  (params.get("name") || "").trim();

const loginToken =
  (params.get("token") || "").trim();

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderUserName(){
  const box = document.getElementById("userBox");
  if(!box) return;

  if(empName){
    box.innerHTML = "<b>" + escapeHtml(empName) + "</b> さんでログイン中";
  }else{
    box.textContent = "名前がありません";
  }
}

function appendName(url){
  let result = String(url || "").trim();

  if(!result){
    alert("URLが設定されていません。");
    return "";
  }

  if(empName){
    result +=
      (result.includes("?") ? "&" : "?") +
      "name=" +
      encodeURIComponent(empName);
  }

  if(loginToken){
    result +=
      (result.includes("?") ? "&" : "?") +
      "token=" +
      encodeURIComponent(loginToken);
  }

  result +=
    (result.includes("?") ? "&" : "?") +
    "t=" +
    Date.now();

  return result;
}

function move(url){
  const target = appendName(url);
  if(target){
    location.href = target;
  }
}

/* ===== 各メニュー ===== */
function goAlcohol(){ move(ALCOHOL_URL); }
function goForm(){ move(FORM_URL); }
function goProperty(){
  location.href = appendName(SHATAKU_URL);
}
function goPropertyPhoto(){
  const url = SHATAKU_URL.replace('page=property', 'page=shataku');
  location.href = appendName(url);
}
function goChat(){ move(CHAT_URL); }
function goCar(){ move(CAR_URL); }
function goUse(){ move(USE_URL); }
function goSchedule(){ move(SCHEDULE_URL); }
function goJob(){ move(JOB_URL); }
function goResume(){ move(RESUME_URL); }
function goPropertyViewer(){ move(VIEWER_URL); }
function goAdvance(){ move(ADVANCE_URL); }
  
function goHome(){
  window.location.replace(
    "https://linkage9696.github.io/linkage/?setup=1&t=" + Date.now()
  );
}
  
function goAdmin(){
  move(ADMIN_URL);
}

function copyForm(){
  const url = appendName(FORM_URL);
  if(!url) return;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      alert("応募フォームURLをコピーしました。");
    }).catch(function(){
      prompt("このURLをコピーしてください", url);
    });
  }else{
    prompt("このURLをコピーしてください", url);
  }
}

/* ===== 利用メニュー制御 ===== */
function applyMenuPermissions(){

  const menus =
    String(window.allowedMenus || "").trim();

  const isAll =
    menus.toUpperCase() === "ALL";

  const allowed =
    isAll
      ? []
      : menus
          .split(",")
          .map(function(item){
            return item.trim().toLowerCase();
          })
          .filter(Boolean);


  // ===== 通常メニュー =====
  if(!isAll){

    // まず通常メニューを全部非表示
    document.querySelectorAll(".btn").forEach(function(button){
      button.style.display = "none";
    });

    // G列にあるメニューだけ表示
    allowed.forEach(function(menu){

      const button =
        document.querySelector(".btn." + menu);

      if(button){
        button.style.display = "block";
      }

    });

  }


  // ===== 下部メニュー =====

  // ホームは全員表示
  const navHome = document.querySelector(".navHome");
  if(navHome){
    navHome.style.display = "flex";
  }

  // 車両：car または ALL
  const navCar = document.querySelector(".navCar");
  if(navCar){
    navCar.style.display =
      (isAll || allowed.includes("car")) ? "flex" : "none";
  }

  // 使用：use または ALL
  const navUse = document.querySelector(".navUse");
  if(navUse){
    navUse.style.display =
      (isAll || allowed.includes("use")) ? "flex" : "none";
  }

    // チャット：chat または ALL
  const navChat = document.querySelector(".navChat");
  if(navChat){
    navChat.style.display =
      (isAll || allowed.includes("chat")) ? "flex" : "none";
  }


  // ===== 管理権限制御（H列） =====

  const permissions =
    String(window.managementPermissions || "").trim();

  const managementAll =
    permissions.toUpperCase() === "ALL";

  const managementAllowed =
    managementAll
      ? []
      : permissions
          .split(",")
          .map(function(item){
            return item.trim().toLowerCase();
          })
          .filter(Boolean);

  // H列に管理権限がある人だけ「管理画面」を表示
  const adminButton =
    document.querySelector(".btn.admin");

  if(adminButton){
    adminButton.style.display =
      (managementAll || managementAllowed.length > 0)
        ? "block"
        : "none";
  }

}
  
/* ===== 更新管理 ===== */
function normalizeVersion(v){
  return String(v || "").trim().toLowerCase();
}

async function checkUpdateInfo(){
  try{
    const res = await fetch(UPDATE_API_URL + "?t=" + Date.now(), { cache:"no-store" });
    const data = await res.json();

    const updateOn = data.update_on === true || String(data.update_on).toLowerCase() === "true";
    const forceUpdate = data.force_update === true || String(data.force_update).toLowerCase() === "true";
    const newVersion = normalizeVersion(data.version);
    const currentVersion = normalizeVersion(CURRENT_MENU_VERSION);

    if(!updateOn) return;
    if(newVersion && newVersion === currentVersion) return;

    document.getElementById("updateTitle").textContent = data.title || "更新があります";
    document.getElementById("updateVersion").textContent = data.version ? "バージョン: " + data.version : "";
    document.getElementById("updateMessage").textContent = data.message || "最新版へ更新してください。";

    document.getElementById("updateGoBtn").onclick = function(){
      let newUrl = data.new_url || location.href;

      if(empName){
        newUrl += (newUrl.includes("?") ? "&" : "?") + "name=" + encodeURIComponent(empName);
      }

      newUrl += (newUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
      location.href = newUrl;
    };

    const laterBtn = document.getElementById("updateLaterBtn");

    if(forceUpdate){
      laterBtn.style.display = "none";
      document.body.style.overflow = "hidden";
    }else{
      laterBtn.style.display = "block";
      laterBtn.onclick = function(){
        document.getElementById("updateOverlay").style.display = "none";
      };
    }

    document.getElementById("updateOverlay").style.display = "flex";

  }catch(e){
    console.log("更新情報の取得失敗", e);
  }
}

const LOGIN_URL =
  "https://script.google.com/macros/s/AKfycbzEt-U0hd9QuoPOdDmWxJWrYejnQdrBPkwpXfdaHIchde5uPS8RJ5c8f2mPpifZ_MxA/exec";

// ログイン開始
function startLoginCheck() {

  const requestId =
    "login_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2);

  const requestInput =
    document.getElementById("loginRequestId");

  if (!requestInput) {
    return;
  }

  // GASへ渡す識別番号をセット
  requestInput.value = requestId;

  // ログイン結果の確認を開始
  setTimeout(function() {
    checkLoginResult(requestId, 0);
  }, 1000);
}


// GASにログイン結果を確認する
async function checkLoginResult(requestId, count) {

  // 最大15回（約15秒）
  if (count >= 15) {
    alert(
      "ログイン確認に時間がかかっています。\n" +
      "もう一度ログインしてください。"
    );
    return;
  }

  try {

    const url =
      LOGIN_URL +
      "?action=loginResult" +
      "&requestId=" +
      encodeURIComponent(requestId) +
      "&t=" +
      Date.now();

    const response =
      await fetch(url);

    const result =
      await response.json();

    // ログイン成功
if (
  result &&
  result.success === true &&
  result.name &&
  result.token
) {

  const menuUrl =
    "https://linkage9696.github.io/linkage/" +
    "?name=" +
    encodeURIComponent(result.name) +
    "&token=" +
    encodeURIComponent(result.token);

  window.location.replace(menuUrl);
  return;
}


// まだGAS側でログイン処理中
if (
  result &&
  result.success === false &&
  result.waiting === true
) {
  // 下の再確認処理へ進む
}

// 本当にログイン失敗（PIN間違いなど）
else if (
  result &&
  result.success === false
) {

  const message =
    document.getElementById("setupLoginMessage");

  if(message){
    message.style.color = "#dc2626";
    message.textContent =
      result.message || "暗証番号が違います。";
  }

  return;
}
  } catch (error) {

    console.log(
      "ログイン結果確認エラー:",
      error
    );
  }

  // まだGASの認証処理中なら1秒後に再確認
  setTimeout(function() {
    checkLoginResult(
      requestId,
      count + 1
    );
  }, 1000);
}

/* ===== 無操作ログアウト ===== */

// 30分無操作でログアウト
const IDLE_TIMEOUT = 30 * 60 * 1000;

let idleTimer = null;

function resetIdleTimer(){

  clearTimeout(idleTimer);

  idleTimer = setTimeout(function(){

    const LOGIN_URL =
      "https://script.google.com/macros/s/AKfycbzEt-U0hd9QuoPOdDmWxJWrYejnQdrBPkwpXfdaHIchde5uPS8RJ5c8f2mPpifZ_MxA/exec";

    window.location.replace(LOGIN_URL);

  }, IDLE_TIMEOUT);
}

function startIdleTimer(){

  const events = [
    "click",
    "touchstart",
    "keydown",
    "scroll"
  ];

  events.forEach(function(eventName){
    window.addEventListener(
      eventName,
      resetIdleTimer,
      { passive: true }
    );
  });

  resetIdleTimer();
}

// 認証成功後にメニューを表示

renderUserName();
